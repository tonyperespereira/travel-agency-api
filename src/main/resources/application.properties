spring.application.name=travel-agency-api

spring.datasource.url=jdbc:postgresql://localhost:5432/agencia_viagens
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

jwt.secret=${JWT_SECRET:chave-secreta-super-longa-para-assinar-tokens-jwt-agencia-viagens-2026}
jwt.expiration-ms=86400000
